# Route-Weather.jp 中継（ADD_03）。配置は手元から：cd worker && npx wrangler deploy
name = "route-weather-relay"
main = "src/index.mjs"
compatibility_date = "2025-06-01"
workers_dev = true   # 旧住所（route-weather-relay.route-weather.workers.dev）。古い版のアプリが残る間は生かしておく
# 独自ドメイン（2026-09-27 に route-weather.jp の DNS を Cloudflare へ移管。DNS 記録と証明書は Cloudflare が自動で作る）
routes = [
  { pattern = "api.route-weather.jp", custom_domain = true }
]

[vars]
# 許可する呼び出し元（カンマ区切り）。ローカル確認時は http://localhost:8766 を足す
ALLOWED_ORIGINS = "https://route-weather.jp,https://hirohitokanamori.github.io"
# OAuth（Stage 2）。client_id は公開値、redirect_uri は API クライアントに登録した値と一致させる
RWGPS_CLIENT_ID = "utYdUEU0XPHVePXnKqqhDc7Aw_yxD4AK4hoif9SQTgA"
OAUTH_REDIRECT_URI = "https://route-weather.jp/"

# 秘密は wrangler secret put で登録する（このファイルには書かない）
#   npx wrangler secret put RWGPS_API_KEY
#   npx wrangler secret put RWGPS_AUTH_TOKEN
#   npx wrangler secret put RWGPS_CLIENT_SECRET   （Stage 2 のトークン交換用）
